spring.application.name=auth
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_POSTGRES_HOST}:${DB_POSTGRES_PORT}/${DB_POSTGRES_AUTH}
spring.datasource.username=${DB_POSTGRES_USER}
spring.datasource.password=${DB_POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POSTGRES_HIKARI_MAX_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


app.security.jwt.issuer=${JWT_ISSUER:solaria-auth}
# TTL do access token, com default de 15 minutos.
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
# TTL do refresh token, com default de 7 dias.
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}
# Caminho do keystore PKCS12 com o par de chave RSA
app.security.jwt.keystore-path=${JWT_KEYSTORE_PATH}
# Senha do keystore acima
app.security.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD}
# Kid/alias da chave atualmente usada para ASSINAR novos tokens
app.security.jwt.active-kid=${JWT_ACTIVE_KID}
app.security.firebase.enabled=${FIREBASE_ENABLED:false}
app.security.firebase.project-id=${FIREBASE_PROJECT_ID:}

server.port=${SERVER_PORT:8081}

# URL base de api-core
app.integration.core.base-url=${CORE_BASE_URL:http://localhost:8080}
# Timeout de conexão da chamada HTTP a api-core.
app.integration.core.connect-timeout=${CORE_CONNECT_TIMEOUT:PT2S}
# Timeout de leitura da chamada HTTP a api-core.
app.integration.core.read-timeout=${CORE_READ_TIMEOUT:PT5S}

# Host/porta do Redis usado pela fila de outbox (mesma instância Upstash do api-core)
spring.data.redis.host=${UPSTASH_CORE_HOST:localhost}
spring.data.redis.port=${UPSTASH_CORE_PORT:6379}

# Intervalo entre execuções do OutboxPollingScheduler, em milissegundos.
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:2000}
# Quantidade máxima de outbox_event lidos por execução do poller.
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
# Chave da Redis Stream onde os eventos de outbox são publicados.
app.outbox.stream-key=${OUTBOX_STREAM_KEY:auth:outbox:user-events}
# Nome do consumer group que lê a stream acima (consumido por UserRegisteredEventListener).
app.outbox.consumer-group=${OUTBOX_CONSUMER_GROUP:core-user-provisioner}
# Chave da Redis Stream usada como dead-letter, para entregas que excederam max-delivery-attempts.
app.outbox.dlq-stream-key=${OUTBOX_DLQ_STREAM_KEY:auth:outbox:user-events:dlq}
# Tentativas de entrega antes de mover a mensagem para a DLQ.
app.outbox.max-delivery-attempts=${OUTBOX_MAX_DELIVERY_ATTEMPTS:5}
# Tempo (ms) que uma mensagem pode ficar pendente sem ACK antes de ser reclamada para retry.
app.outbox.visibility-timeout-ms=${OUTBOX_VISIBILITY_TIMEOUT_MS:60000}
# Intervalo entre execuções do OutboxDeadLetterReclaimer, em milissegundos.
app.outbox.reclaim-interval-ms=${OUTBOX_RECLAIM_INTERVAL_MS:30000}
# Desliga o OutboxStreamConsumerConfig (sem Redis real)
app.outbox.consumer.enabled=${OUTBOX_CONSUMER_ENABLED:true}


# Observabilidade (Actuator + Micrometer + Micrometer Tracing + OpenTelemetry SDK)
# A aplicacao exporta OTLP (metricas + traces + logs) para o OpenTelemetry Collector.

# identidade do servico no backend de observabilidade
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.version=${SERVICE_VERSION:dev}
management.opentelemetry.resource-attributes.deployment.environment=${DEPLOYMENT_ENVIRONMENT:local}

# endpoints OTLP | todos apontam para o Collector
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs

# head sampling 100% | tail sampling no Collector
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}

# Actuator restrito a health/info (telemetria e push -> sem endpoint de scrape)
management.endpoints.web.exposure.include=health,info
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only

# probes do k8s (/actuator/health/{liveness,readiness})
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never


#queda do Redis não tiram todos os pods de api-auth do load balancer
management.health.redis.enabled=false

# histograma + buckets SLO para p50/p95/p99 no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# conteudo do /actuator/info
management.info.env.enabled=false
management.info.java.enabled=true
management.info.os.enabled=true
